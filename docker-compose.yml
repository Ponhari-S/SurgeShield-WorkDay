version: '3.8'

networks:
  surgeshield_net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:
  # ----------------------------------------------------
  # Ingress & Load Balancer (Traefik)
  # ----------------------------------------------------
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "80:80"
      - "8080:8080"   # Traefik Dashboard UI
      - "8082:8082"   # Traefik Metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - surgeshield_net
    deploy:
      placement:
        constraints:
          - node.role == manager

  # ----------------------------------------------------
  # Primary Persistence (PostgreSQL)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surgeshield_db
      POSTGRES_USER: surgeshield
      POSTGRES_PASSWORD: surgeshield_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - surgeshield_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgeshield -d surgeshield_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1

  # ----------------------------------------------------
  # Cache & Locks & BullMQ Broker (Redis)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - surgeshield_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1

  # ----------------------------------------------------
  # Backend API Tier (Autoscaled)
  # ----------------------------------------------------
  api:
    build:
      context: ./stubs/api
    image: surgeshield/api:latest
    environment:
      PORT: 3000
      DATABASE_URL: postgres://surgeshield:surgeshield_pass@postgres:5432/surgeshield_db
      REDIS_URL: redis://redis:6379
    networks:
      - surgeshield_net
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/health`)"
        - "traefik.http.routers.api.entrypoints=web"
        - "traefik.http.services.api.loadbalancer.server.port=3000"

  # ----------------------------------------------------
  # Worker Service Pool (Autoscaled)
  # ----------------------------------------------------
  worker:
    build:
      context: ./stubs/worker
    image: surgeshield/worker:latest
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
    networks:
      - surgeshield_net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ----------------------------------------------------
  # Centerpiece: Custom Dockerode Autoscaler
  # ----------------------------------------------------
  autoscaler:
    build:
      context: ./autoscaler
    image: surgeshield/autoscaler:latest
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      POLL_INTERVAL_MS: 5000
      COOLDOWN_TICKS: 6
      MIN_API_REPLICAS: 2
      MAX_API_REPLICAS: 15
      HIGH_RPS_PER_NODE: 30
      HIGH_CPU_PCT: 70
      LOW_RPS_PER_NODE: 10
      LOW_CPU_PCT: 40
      MIN_WORKER_REPLICAS: 1
      MAX_WORKER_REPLICAS: 10
      HIGH_QUEUE_DEPTH: 500
      LOW_QUEUE_DEPTH: 50
    ports:
      - "9091:9091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - surgeshield_net
    deploy:
      placement:
        constraints:
          - node.role == manager

  # ----------------------------------------------------
  # Container Metrics Exporter (cAdvisor)
  # ----------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - surgeshield_net
    deploy:
      mode: global

  # ----------------------------------------------------
  # Observability - Prometheus
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/alert.rules.yml
    volumes:
      - prometheus_data:/prometheus
    networks:
      - surgeshield_net
    ports:
      - "9090:9090"
    deploy:
      replicas: 1

  # ----------------------------------------------------
  # Observability - Alertmanager
  # ----------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    networks:
      - surgeshield_net
    ports:
      - "9093:9093"
    deploy:
      replicas: 1

  # ----------------------------------------------------
  # Observability - Grafana Dashboard
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_ds
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_db_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_db_json
        target: /etc/grafana/provisioning/dashboards/json/surgeshield-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - surgeshield_net
    deploy:
      replicas: 1

configs:
  prometheus_config:
    file: ./observability/prometheus/prometheus.yml
  prometheus_rules:
    file: ./observability/prometheus/alert.rules.yml
  alertmanager_config:
    file: ./observability/alertmanager/alertmanager.yml
  grafana_ds:
    file: ./observability/grafana/provisioning/datasources/prometheus.yml
  grafana_db_provider:
    file: ./observability/grafana/provisioning/dashboards/dashboards.yml
  grafana_db_json:
    file: ./observability/grafana/dashboards/surgeshield-overview.json


